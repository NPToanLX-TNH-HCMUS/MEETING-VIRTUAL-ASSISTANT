[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "MEETING-VIRTUAL-ASSISTANT"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.28.1, <3.0.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.5.6",
    "scipy>=1.18.1",
    "markitdown[pdf,docx,doc]",
    "fastapi",
    "uvicorn",
    "requests",
    "datasketch==2.0.0",
    "jsonschema>=4,<5",
    "python-multipart",
    "langchain-core==0.3.63",
    "langchain-text-splitters==0.3.8",
    "langchain-community==0.3.24",
    "langchain-ollama",
    "langchain-experimental==0.3.4",   # semantic chunking
]
# Equivalent to `REQUIREMENTS` in `setup.cfg` or `install_requires` in `setup.py`


[tool.hatch.build.targets.wheel]
packages = ["src"]
