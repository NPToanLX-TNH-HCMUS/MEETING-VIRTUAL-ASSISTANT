[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "MEETING-VIRTUAL-ASSISTANT"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.28.1, <3.0.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.5.6",
    "scipy>=1.18.1",
    "markitdown[pdf,docx]",
    "fastapi",
    "pydantic",
    "uvicorn[standard]",
    "datasketch==2.0.0",
    "sqlalchemy",
    "jsonschema>=4,<5",
    "python-multipart",
    "langchain-core==0.3.63",
    "langchain-text-splitters==0.3.8",
    "langchain-community==0.3.24",
    "langchain-experimental==0.3.4",   # semantic chunking
    "websockets",
    "numpy",
    "psycopg[binary]",
    "supabase",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
    "httpx>=0.27",
    "ruff>=0.4.0",
]


[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers -ra"
markers = [
    "unit: Unit tests (fast, isolated, mocked I/O and hardware)",
    "integration: Cross-module data pipeline handoff tests",
    "evaluation: Quantitative SLA benchmark tests (WER, Precision, Recall, F1)",
    "e2e: End-to-End full meeting lifecycle tests",
]
