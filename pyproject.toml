[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "MEETING-VIRTUAL-ASSISTANT"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
# Equivalent to `REQUIREMENTS` in `setup.cfg` or `install_requires` in `setup.py`
dependencies = [
    "requests>=2.28.1, <3.0.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-genai>=2.31.0",
    "sounddevice>=0.5.6",
    "scipy>=1.18.1",
    "fastapi",
    "uvicorn",
    "google",
    "requests"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]


[project.scripts]
mia = "src.app:main"
