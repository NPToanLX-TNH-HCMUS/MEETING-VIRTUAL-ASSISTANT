[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "MEETING-VIRTUAL-ASSISTANT"
version = "0.1.0"
readme = "README.md"
required-python = ">=3.14"
# Equivalent to `REQUIREMENTS` in `setup.cfg` or `install_requires` in `setup.py`
dependencies = [
    "requests>=2.28.1, <3.0.0",
    "dotenv>=0.9.9",
    "google-api-python-client>=2.100.0",
    "google-genai>=2.31.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/meeting_virtual_assistant"]


[project.scripts]
mia = "meeting_virtual_assistant.app:main"
