<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đang họp · Meeting Virtual Assistant</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">Meeting Virtual Assistant</div>
    </header>

    <main class="layout">
      <section class="column column--main">
        <div class="card">
          <div id="error" class="banner banner--error" role="alert" hidden></div>
          <div class="card__head"><h1 class="card__title">Cuộc họp đang diễn ra</h1></div>

          <p id="status" class="muted" aria-live="polite">Sẵn sàng.</p>

          <div class="btn-row">
            <button id="toggle" type="button" class="btn btn--primary">Bắt đầu ghi âm</button>
            <button id="transcribe" type="button" class="btn" disabled>Chuyển thành văn bản</button>
          </div>
          <pre id="transcript" class="transcript" hidden></pre>
        </div>
      </section>
    </main>

    <script type="module" src="/js/during.js"></script>
  </body>
</html>
