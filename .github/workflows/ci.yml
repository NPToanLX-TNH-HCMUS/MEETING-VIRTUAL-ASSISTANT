name: Backend unit tests

on:
  push:
    branches: [feat/ci, feat/system-test-strategy]
  pull_request:
    branches: [feat/system-test-strategy]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHON_DOTENV_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/workflows/ci.yml

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest==9.2.0 pytest-cov==7.1.0

      - name: Run unit tests
        run: >-
          python -m pytest tests/unit
          --junitxml=reports/ci-unit/results.xml
          --cov=src/backend --cov-branch
          --cov-report=term-missing
          --cov-report=xml:reports/ci-unit/coverage.xml
          --cov-report=html:reports/ci-unit/html

      - name: Upload test results and coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: backend-unit-test-reports-${{ matrix.os }}
          path: reports/ci-unit/
          retention-days: 14
          if-no-files-found: warn
